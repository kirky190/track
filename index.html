<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Zoom Tracker</title>
<style>
  :root {
    --bg: #0b0d10;
    --panel: #14171b;
    --accent: #4ade80;
    --text: #e6e8eb;
    --muted: #8b93a1;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, Roboto, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px;
  }
  h1 { font-size: 18px; font-weight: 600; margin: 4px 0 12px; }
  #stage {
    position: relative;
    width: 100%;
    max-width: 640px;
    aspect-ratio: 4 / 3;
    background: #000;
    border-radius: 10px;
    overflow: hidden;
  }
  canvas#display { width: 100%; height: 100%; display: block; touch-action: none; }
  #status {
    margin-top: 10px;
    font-size: 13px;
    color: var(--muted);
    min-height: 18px;
    text-align: center;
  }
  .controls {
    width: 100%;
    max-width: 640px;
    background: var(--panel);
    border-radius: 10px;
    padding: 12px 16px;
    margin-top: 12px;
  }
  .row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  button {
    background: #1e2329;
    color: var(--text);
    border: 1px solid #2a3038;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 14px;
    flex: 1;
    min-width: 110px;
  }
  button.primary { background: var(--accent); color: #0b0d10; font-weight: 600; border: none; }
  button.zoom-btn { flex: none; min-width: 52px; font-size: 20px; font-weight: 700; }
  .zoom-readout { flex: 1; text-align: center; align-self: center; font-size: 14px; color: var(--muted); }
  .slider-row { margin-bottom: 10px; }
  .slider-row label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 2px;
  }
  input[type="range"] { width: 100%; }

  /* Landscape: put the video and controls side-by-side, video takes most
     of the width, controls become a scrollable side panel. */
  @media (orientation: landscape) {
    body { flex-direction: row; align-items: flex-start; padding: 8px; gap: 8px; }
    h1 { display: none; }
    #stage { max-width: none; flex: 1 1 auto; height: calc(100vh - 16px); aspect-ratio: auto; }
    #status { position: absolute; bottom: 8px; left: 8px; right: 8px; margin: 0; background: rgba(0,0,0,0.5); border-radius: 6px; padding: 4px; }
    .controls { max-width: 260px; height: calc(100vh - 16px); overflow-y: auto; margin-top: 0; flex: none; }
  }
</style>
</head>
<body>

  <h1>Zoom Tracker</h1>

  <div id="stage">
    <canvas id="display"></canvas>
  </div>
  <div id="status">Loading vision engine…</div>
  <div id="zoomCapability" style="font-size:12px;color:#8b93a1;text-align:center;margin-top:2px;"></div>

  <div class="controls">
    <div class="row">
      <button id="startBtn" class="primary">Start camera</button>
      <button id="flipBtn">Switch camera</button>
      <button id="resetBtn">Reset tracking</button>
    </div>

    <div class="row">
      <button id="zoomOutBtn" class="zoom-btn">−</button>
      <span class="zoom-readout" id="zoomReadout">1.0x</span>
      <button id="zoomInBtn" class="zoom-btn">+</button>
      <button id="fullscreenBtn">Fullscreen</button>
    </div>

    <div class="slider-row">
      <label><span>Target box size</span><span id="v-target"></span></label>
      <input type="range" id="targetFraction" min="0.05" max="0.6" step="0.01" value="0.28" />
    </div>
    <div class="slider-row">
      <label><span>Pan smoothing</span><span id="v-pan"></span></label>
      <input type="range" id="panSmoothing" min="0.02" max="0.6" step="0.01" value="0.18" />
    </div>
    <div class="slider-row">
      <label><span>Zoom smoothing</span><span id="v-zoom"></span></label>
      <input type="range" id="zoomSmoothing" min="0.02" max="0.6" step="0.01" value="0.12" />
    </div>
    <div class="slider-row">
      <label><span>Max zoom-in</span><span id="v-min"></span></label>
      <input type="range" id="minCropFraction" min="0.02" max="0.5" step="0.01" value="0.10" />
    </div>
  </div>

  <!-- OpenCV.js — provides goodFeaturesToTrack + calcOpticalFlowPyrLK for the tracker -->
  <script async src="https://docs.opencv.org/4.9.0/opencv.js" onload="onOpenCvLoad();"></script>

  <script>
  // ---------------------------------------------------------------------
  // Zoom Tracker
  //
  // Tap any object on screen. It's tracked with sparse Lucas-Kanade
  // optical flow (a set of trackable feature points inside the tapped
  // region, followed frame to frame) and the view digitally crops/zooms
  // so the object stays roughly centred and a constant on-screen size.
  //
  // Same control-loop design as the Python/Android versions — this file
  // is the browser port, using OpenCV.js instead of OpenCV's CSRT tracker
  // since optical flow ships in every standard opencv.js build.
  // ---------------------------------------------------------------------

  const video = document.createElement('video');
  video.setAttribute('playsinline', ''); // required for iOS inline playback
  video.muted = true;

  const sourceCanvas = document.createElement('canvas'); // full-res, off-screen
  const sourceCtx = sourceCanvas.getContext('2d', { willReadFrequently: true });

  const displayCanvas = document.getElementById('display');
  const displayCtx = displayCanvas.getContext('2d');

  const statusEl = document.getElementById('status');
  const zoomCapabilityEl = document.getElementById('zoomCapability');
  const startBtn = document.getElementById('startBtn');
  const flipBtn = document.getElementById('flipBtn');
  const resetBtn = document.getElementById('resetBtn');
  const zoomInBtn = document.getElementById('zoomInBtn');
  const zoomOutBtn = document.getElementById('zoomOutBtn');
  const zoomReadout = document.getElementById('zoomReadout');
  const fullscreenBtn = document.getElementById('fullscreenBtn');

  const targetFractionEl = document.getElementById('targetFraction');
  const panSmoothingEl = document.getElementById('panSmoothing');
  const zoomSmoothingEl = document.getElementById('zoomSmoothing');
  const minCropFractionEl = document.getElementById('minCropFraction');
  const vTarget = document.getElementById('v-target');
  const vPan = document.getElementById('v-pan');
  const vZoom = document.getElementById('v-zoom');
  const vMin = document.getElementById('v-min');

  function refreshSliderLabels() {
    vTarget.textContent = targetFractionEl.value;
    vPan.textContent = panSmoothingEl.value;
    vZoom.textContent = zoomSmoothingEl.value;
    vMin.textContent = minCropFractionEl.value;
  }
  [targetFractionEl, panSmoothingEl, zoomSmoothingEl, minCropFractionEl].forEach(el =>
    el.addEventListener('input', refreshSliderLabels)
  );
  refreshSliderLabels();

  let cvReady = false;
  let streaming = false;
  let facingMode = 'environment'; // back camera by default
  let frameW = 0, frameH = 0;
  let currentTrack = null;
  let hasHardwareZoom = false;
  let hwZoomMin = 1, hwZoomMax = 1;

  let tracking = false;
  let prevGray = null;   // cv.Mat, kept between frames — lives in ANALYSIS space
  let prevPts = null;    // cv.Mat (Nx1 CV_32FC2), kept between frames — ANALYSIS space
  let lastBox = null;    // last known bounding box, in SOURCE pixel coords

  // Optical flow runs on a downscaled copy of each frame — full-resolution
  // tracking is far more CPU than a phone browser can sustain smoothly.
  // analysisScale maps SOURCE pixel coords -> ANALYSIS pixel coords.
  const ANALYSIS_MAX_DIM = 400;
  let analysisScale = 1;
  const analysisCanvas = document.createElement('canvas');
  const analysisCtx = analysisCanvas.getContext('2d', { willReadFrequently: true });

  // Only re-run the (expensive) tracking step every Nth rendered frame.
  // The display still redraws every frame using the last known box, so
  // it looks smooth even though tracking itself updates less often.
  const PROCESS_EVERY_N = 2;
  let frameCounter = 0;

  // Crop window in SOURCE pixel coordinates.
  let crop = { left: 0, top: 0, w: 0, h: 0 };

  // Manual zoom — user-controlled multiplier, on top of whatever
  // tracking wants (or centred on frame when nothing is being tracked).
  const MIN_MANUAL_ZOOM = 1;
  const DIGITAL_MAX_ZOOM = 15; // digital-crop-only ceiling, used when hardware zoom isn't available
  let MAX_MANUAL_ZOOM = DIGITAL_MAX_ZOOM;
  let manualZoom = 1;

  function setManualZoom(z) {
    manualZoom = clamp(z, MIN_MANUAL_ZOOM, MAX_MANUAL_ZOOM);
    zoomReadout.textContent = manualZoom.toFixed(1) + 'x' + (hasHardwareZoom ? ' optical' : '');
    if (hasHardwareZoom && currentTrack) {
      const target = clamp(manualZoom, hwZoomMin, hwZoomMax);
      currentTrack.applyConstraints({ advanced: [{ zoom: target }] }).catch(() => {});
    }
  }

  function zoomStep() {
    return Math.max(0.1, (MAX_MANUAL_ZOOM - MIN_MANUAL_ZOOM) / 20);
  }
  zoomInBtn.addEventListener('click', () => setManualZoom(manualZoom + zoomStep()));
  zoomOutBtn.addEventListener('click', () => setManualZoom(manualZoom - zoomStep()));

  fullscreenBtn.addEventListener('click', async () => {
    try {
      if (!document.fullscreenElement) {
        await document.documentElement.requestFullscreen();
      }
      if (screen.orientation && screen.orientation.lock) {
        await screen.orientation.lock('landscape').catch(() => {});
      }
    } catch (e) {
      // Fullscreen/orientation lock isn't available on every browser
      // (notably iOS Safari) — the CSS landscape layout still applies
      // if the user just rotates the phone manually.
    }
  });

  function onOpenCvLoad() {
    cv['onRuntimeInitialized'] = () => {
      cvReady = true;
      statusEl.textContent = 'Ready — tap "Start camera"';
    };
  }

  startBtn.addEventListener('click', startCamera);
  flipBtn.addEventListener('click', () => {
    facingMode = facingMode === 'environment' ? 'user' : 'environment';
    if (streaming) startCamera();
  });
  resetBtn.addEventListener('click', resetTracking);

  async function startCamera() {
    if (!cvReady) {
      statusEl.textContent = 'Still loading vision engine, one sec…';
      return;
    }
    stopStream();

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      statusEl.textContent = 'This browser has no camera API available — try opening this page directly in Chrome or Safari (not an in-app/embedded browser).';
      return;
    }

    let stream;
    try {
      // First choice: ask for the requested facing camera specifically.
      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: facingMode },
          width: { ideal: 1920 }, height: { ideal: 1080 },
          zoom: true // non-standard hint — ignored harmlessly where unsupported, but on
                     // some Chrome/Android builds this is needed to expose zoom capability
        },
        audio: false
      });
    } catch (err1) {
      try {
        // Fallback: some browsers/devices reject the facingMode constraint
        // even when a camera exists — ask for literally any camera instead.
        stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
      } catch (err2) {
        statusEl.textContent = describeCameraError(err2);
        return;
      }
    }

    try {
      video.srcObject = stream;
      await video.play();

      currentTrack = stream.getVideoTracks()[0];
      hasHardwareZoom = false;
      let diagMsg = '';
      try {
        if (!currentTrack.getCapabilities) {
          diagMsg = 'This browser doesn\'t expose camera capabilities — digital zoom only.';
        } else {
          const caps = currentTrack.getCapabilities();
          if (caps && caps.zoom && caps.zoom.max > caps.zoom.min) {
            hasHardwareZoom = true;
            hwZoomMin = caps.zoom.min;
            hwZoomMax = caps.zoom.max;
            diagMsg = `Optical/hardware zoom available: ${hwZoomMin}x–${hwZoomMax}x (this engages your phone's real lens switching)`;
          } else {
            diagMsg = 'No hardware zoom control exposed on this camera/browser — using digital crop only.';
          }
        }
      } catch (e) {
        diagMsg = 'Zoom capability check failed — using digital crop only.';
      }
      zoomCapabilityEl.textContent = diagMsg;

      MAX_MANUAL_ZOOM = hasHardwareZoom ? hwZoomMax : DIGITAL_MAX_ZOOM;
      setManualZoom(1);

      frameW = video.videoWidth;
      frameH = video.videoHeight;
      sourceCanvas.width = frameW;
      sourceCanvas.height = frameH;

      analysisScale = Math.min(1, ANALYSIS_MAX_DIM / Math.max(frameW, frameH));
      analysisCanvas.width = Math.round(frameW * analysisScale);
      analysisCanvas.height = Math.round(frameH * analysisScale);

      const stageAspect = frameW / frameH;
      displayCanvas.width = 640;
      displayCanvas.height = Math.round(640 / stageAspect);

      crop = { left: 0, top: 0, w: frameW, h: frameH };
      resetTracking();
      streaming = true;
      statusEl.textContent = 'Tap an object to track it';
      requestAnimationFrame(tick);
    } catch (err) {
      statusEl.textContent = describeCameraError(err);
    }
  }

  function describeCameraError(err) {
    const name = err && err.name;
    if (name === 'NotFoundError' || name === 'DevicesNotFoundError') {
      return "No camera found. If you're in an app's built-in browser (GitHub, a share sheet, etc.) copy this link and open it in Chrome or Safari directly — embedded browsers often can't see the camera.";
    }
    if (name === 'NotAllowedError' || name === 'PermissionDeniedError') {
      return 'Camera permission was blocked. Check your browser (or the OS app permission for it) allows camera access for this site, then reload.';
    }
    if (name === 'NotReadableError' || name === 'TrackStartError') {
      return 'Camera is busy — close any other app currently using it, then try again.';
    }
    if (name === 'OverconstrainedError') {
      return "Camera doesn't support the requested settings — try Switch camera, or reload and try again.";
    }
    return 'Camera error: ' + (err && err.message ? err.message : err);
  }

  function stopStream() {
    const s = video.srcObject;
    if (s) s.getTracks().forEach(t => t.stop());
    streaming = false;
  }

  function resetTracking() {
    tracking = false;
    lastBox = null;
    frameCounter = 0;
    if (prevGray) { prevGray.delete(); prevGray = null; }
    if (prevPts) { prevPts.delete(); prevPts = null; }
    if (frameW && frameH) crop = { left: 0, top: 0, w: frameW, h: frameH };
  }

  function tick() {
    if (!streaming) return;
    sourceCtx.drawImage(video, 0, 0, frameW, frameH);

    let box = lastBox;
    frameCounter++;

    if (tracking && frameCounter % PROCESS_EVERY_N === 0) {
      box = stepOpticalFlow();
      if (box) {
        lastBox = box;
        updateCropTowards(box);
      } else {
        statusEl.textContent = 'Lost object — tap it again to reacquire';
        resetTracking();
        box = null;
      }
    } else if (!tracking) {
      // Idle manual zoom: centre-crop the frame according to manualZoom.
      // If hardware zoom is driving the actual lens, the incoming video
      // is already zoomed in — don't crop again on top of that.
      const aspect = frameW / frameH;
      const minCropW = frameW * parseFloat(minCropFractionEl.value);
      const digitalZoom = hasHardwareZoom ? 1 : manualZoom;
      const targetW = clamp(frameW / digitalZoom, minCropW, frameW);
      const targetH = targetW / aspect;
      crop = {
        left: (frameW - targetW) / 2,
        top: (frameH - targetH) / 2,
        w: targetW, h: targetH
      };
    }

    render(box);
    requestAnimationFrame(tick);
  }

  function stepOpticalFlow() {
    analysisCtx.drawImage(sourceCanvas, 0, 0, analysisCanvas.width, analysisCanvas.height);
    const rgba = cv.imread(analysisCanvas);
    const currGray = new cv.Mat();
    cv.cvtColor(rgba, currGray, cv.COLOR_RGBA2GRAY);
    rgba.delete();

    const nextPts = new cv.Mat();
    const status = new cv.Mat();
    const err = new cv.Mat();
    const winSize = new cv.Size(15, 15);
    const criteria = new cv.TermCriteria(cv.TERM_CRITERIA_EPS | cv.TERM_CRITERIA_COUNT, 20, 0.03);

    cv.calcOpticalFlowPyrLK(prevGray, currGray, prevPts, nextPts, status, err, winSize, 2, criteria);

    const good = [];
    for (let i = 0; i < status.rows; i++) {
      if (status.data[i] === 1) {
        good.push([nextPts.data32F[i * 2], nextPts.data32F[i * 2 + 1]]);
      }
    }

    prevGray.delete();
    prevGray = currGray;
    prevPts.delete();
    nextPts.delete();
    status.delete();
    err.delete();

    if (good.length < 4) {
      prevPts = null;
      return null;
    }

    const xs = good.map(p => p[0]);
    const ys = good.map(p => p[1]);
    const minX = Math.min(...xs), maxX = Math.max(...xs);
    const minY = Math.min(...ys), maxY = Math.max(...ys);

    const flat = [];
    good.forEach(p => flat.push(p[0], p[1]));
    prevPts = cv.matFromArray(good.length, 1, cv.CV_32FC2, flat);

    // Convert ANALYSIS-space box back to SOURCE pixel coords.
    const inv = 1 / analysisScale;
    return {
      x: minX * inv, y: minY * inv,
      w: Math.max((maxX - minX) * inv, 10),
      h: Math.max((maxY - minY) * inv, 10)
    };
  }

  function updateCropTowards(box) {
    const aspect = frameW / frameH;
    const minCropW = frameW * parseFloat(minCropFractionEl.value);
    const targetFrac = Math.max(parseFloat(targetFractionEl.value), 0.01);
    const za = parseFloat(zoomSmoothingEl.value);
    const pa = parseFloat(panSmoothingEl.value);

    const boxSize = Math.max(box.w, box.h);
    const digitalZoom = hasHardwareZoom ? 1 : manualZoom;
    const desiredW = clamp(boxSize / targetFrac / digitalZoom, minCropW, frameW);
    const desiredCx = box.x + box.w / 2;
    const desiredCy = box.y + box.h / 2;

    const curCx = crop.left + crop.w / 2;
    const curCy = crop.top + crop.h / 2;

    const newW = crop.w + (desiredW - crop.w) * za;
    const newH = newW / aspect;
    const newCx = curCx + (desiredCx - curCx) * pa;
    const newCy = curCy + (desiredCy - curCy) * pa;

    let left = clamp(newCx - newW / 2, 0, Math.max(frameW - newW, 0));
    let top = clamp(newCy - newH / 2, 0, Math.max(frameH - newH, 0));

    crop = { left, top, w: newW, h: newH };
  }

  function clamp(v, lo, hi) { return Math.min(Math.max(v, lo), hi); }

  function render(box) {
    const dw = displayCanvas.width, dh = displayCanvas.height;
    displayCtx.drawImage(
      sourceCanvas,
      crop.left, crop.top, crop.w, crop.h,
      0, 0, dw, dh
    );

    if (tracking && box) {
      const sx = dw / crop.w, sy = dh / crop.h;
      const x = (box.x - crop.left) * sx;
      const y = (box.y - crop.top) * sy;
      const w = box.w * sx;
      const h = box.h * sy;
      displayCtx.strokeStyle = '#4ade80';
      displayCtx.lineWidth = 3;
      displayCtx.strokeRect(x, y, w, h);
    } else if (!tracking) {
      displayCtx.fillStyle = 'rgba(255,255,255,0.85)';
      displayCtx.font = '16px sans-serif';
      displayCtx.fillText('Tap an object to track it', 16, 28);
    }
  }

  // ---- Tap to select an object, pinch to manually zoom -------------------
  // Native touch events, not Pointer Events — multi-touch (pinch) is far
  // more reliably reported this way across mobile browsers.
  let pinchStartDist = null;
  let pinchStartZoom = 1;
  let isPinching = false;
  let tapCandidate = null; // {x, y, t} — cleared if it turns into a pinch

  function touchDistance(touches) {
    if (touches.length < 2) return 0;
    return Math.hypot(
      touches[0].clientX - touches[1].clientX,
      touches[0].clientY - touches[1].clientY
    );
  }

  displayCanvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (e.touches.length === 1) {
      tapCandidate = { x: e.touches[0].clientX, y: e.touches[0].clientY, t: performance.now() };
      isPinching = false;
    } else if (e.touches.length >= 2) {
      isPinching = true;
      tapCandidate = null;
      pinchStartDist = touchDistance(e.touches);
      pinchStartZoom = manualZoom;
    }
  }, { passive: false });

  displayCanvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    if (isPinching && e.touches.length >= 2 && pinchStartDist > 0) {
      const dist = touchDistance(e.touches);
      setManualZoom(pinchStartZoom * (dist / pinchStartDist));
    }
  }, { passive: false });

  function onTouchEnd(e) {
    e.preventDefault();
    if (e.touches.length < 2) {
      isPinching = false;
      pinchStartDist = null;
    }
    if (e.touches.length === 0 && tapCandidate) {
      const dt = performance.now() - tapCandidate.t;
      if (dt < 350) onTap(tapCandidate.x, tapCandidate.y);
      tapCandidate = null;
    }
  }
  displayCanvas.addEventListener('touchend', onTouchEnd, { passive: false });
  displayCanvas.addEventListener('touchcancel', onTouchEnd, { passive: false });

  // Desktop/mouse fallback (for testing on a laptop) — click to select,
  // no pinch equivalent, use the +/- buttons instead.
  displayCanvas.addEventListener('click', (e) => onTap(e.clientX, e.clientY));

  function onTap(clientX, clientY) {
    if (!streaming || !cvReady) return;
    const rect = displayCanvas.getBoundingClientRect();
    const viewX = ((clientX - rect.left) / rect.width) * displayCanvas.width;
    const viewY = ((clientY - rect.top) / rect.height) * displayCanvas.height;

    const scaleX = crop.w / displayCanvas.width;
    const scaleY = crop.h / displayCanvas.height;
    const srcX = crop.left + viewX * scaleX;
    const srcY = crop.top + viewY * scaleY;

    // Size the selection box relative to what's currently ON SCREEN
    // (crop.w), not the full source frame — otherwise at high zoom this
    // box would cover most of the visible view and grab the wrong thing.
    const boxSize = Math.max(crop.w * 0.12, 24);
    const x = clamp(srcX - boxSize / 2, 0, frameW - boxSize);
    const y = clamp(srcY - boxSize / 2, 0, frameH - boxSize);

    initTrackerAt(x, y, boxSize, boxSize);
  }

  function initTrackerAt(x, y, w, h) {
    resetTracking();

    analysisCtx.drawImage(sourceCanvas, 0, 0, analysisCanvas.width, analysisCanvas.height);
    const rgba = cv.imread(analysisCanvas);
    const gray = new cv.Mat();
    cv.cvtColor(rgba, gray, cv.COLOR_RGBA2GRAY);
    rgba.delete();

    // Convert the tapped SOURCE-space box into ANALYSIS-space for feature detection.
    const ax = x * analysisScale, ay = y * analysisScale;
    const aw = w * analysisScale, ah = h * analysisScale;

    const mask = cv.Mat.zeros(analysisCanvas.height, analysisCanvas.width, cv.CV_8UC1);
    const pt1 = new cv.Point(Math.round(ax), Math.round(ay));
    const pt2 = new cv.Point(Math.round(ax + aw), Math.round(ay + ah));
    cv.rectangle(mask, pt1, pt2, new cv.Scalar(255), -1);

    const corners = new cv.Mat();
    cv.goodFeaturesToTrack(gray, corners, 30, 0.01, 5, mask, 5, false, 0.04);
    mask.delete();

    if (corners.rows === 0) {
      gray.delete();
      corners.delete();
      statusEl.textContent = "Couldn't find enough detail there — try a more textured spot";
      return;
    }

    prevGray = gray;
    prevPts = corners;
    tracking = true;
    lastBox = { x, y, w, h };
    statusEl.textContent = 'Tracking…';

    updateCropTowards({ x, y, w, h });
  }
  </script>
</body>
</html>
